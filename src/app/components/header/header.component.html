<mat-toolbar>
  <mat-toolbar-row>
    <div class="start">
      <button mat-icon-button>
        <mat-icon>menu</mat-icon>
      </button>
      <span class="youtube-logo">
        <mat-icon class="youtube-icon">smart_display</mat-icon>
        YouTube Clone
      </span>
    </div>
    <div class="end">
      <button mat-icon-button>
        <mat-icon>video_call</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>notifications</mat-icon>
      </button>
      @if (isAuthenticated) {
      <button mat-icon-button class="account-button" (click)="goToAccount()">
        <mat-icon>account_circle</mat-icon>
      </button>
      } @else {
      <button mat-raised-button color="primary" (click)="login()">
        <mat-icon>account_circle</mat-icon>
        Sign in
      </button>
      }
    </div>
  </mat-toolbar-row>
</mat-toolbar>
