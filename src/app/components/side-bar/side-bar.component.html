<mat-sidenav mode="side" opened class="youtube-sidenav">
  <mat-nav-list>
    <a
      mat-list-item
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </a>
    <a mat-list-item routerLink="/history" routerLinkActive="active">
      <mat-icon>history</mat-icon>
      <span>History</span>
    </a>
    <a mat-list-item routerLink="/liked-videos" routerLinkActive="active">
      <mat-icon>thumb_up</mat-icon>
      <span>Liked videos</span>
    </a>
    <mat-divider></mat-divider>
    <div class="subscriptions-section">
      <h3 class="mat-subheader">Subscriptions</h3>
      <a mat-list-item routerLink="/subscriptions" routerLinkActive="active">
        <mat-icon>subscriptions</mat-icon>
        <span>Subscriptions</span>
      </a>
    </div>
  </mat-nav-list>
</mat-sidenav>
